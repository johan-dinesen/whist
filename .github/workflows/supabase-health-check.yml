name: Supabase health check

on:
  schedule:
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: https://hfkfivfixzybvzcpelfa.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7-UWbbKweld6pB5Y-9DqmQ_2atum2AN
    steps:
      - name: Check Whist database responsiveness
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Accept: application/json' \
            "${SUPABASE_URL}/rest/v1/rpc/whist_health_check")
          if [[ "$response" != "true" ]]; then
            echo 'Unexpected health-check response.' >&2
            exit 1
          fi
          echo 'Whist database responded successfully.'
